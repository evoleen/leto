name: leto_schema
version: 0.0.1-dev.6
description: An implementation of GraphQL's type system in Dart. Basis of leto.
repository: https://github.com/juancastillo0/leto

topics:
  - graphql
  - protocol
  - schema
  - language
  - specification

environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:
  collection: ^1.19.1
  gql: ^1.0.0+1
  meta: ^1.17.0
  source_span: ^1.10.1

dev_dependencies:
  lint: ^2.8.0
  test: ^1.26.2

  leto_generator_example:
  leto:

dependency_overrides:
  leto_generator_example:
    path: ../leto_generator/example
  leto:
    path: ../leto
