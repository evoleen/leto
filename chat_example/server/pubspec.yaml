name: server
description: A chat server app using leto, shelf and Docker.
# homepage: https://www.example.com

environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:
  args: ^2.7.0
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  json_path: ^0.7.6
  oxidized: ^6.2.0
  blurhash_dart: ^1.2.1
  metadata_fetch: ^0.4.2
  linkify: ^5.0.0
  crypto: ^3.0.6
  file: ^7.0.1

  sqlite3: ^2.7.6
  mysql1: ^0.20.0
  postgres: ^2.4.1+2

  argon2: ^1.0.1
  jose: ^0.3.4

  uuid: ^4.5.1
  collection: ^1.19.1

  shelf_cors_headers: ^0.1.5
  shelf_plus: ^1.0.2
  shelf_router: ^1.1.4
  shelf_static: ^1.1.3

  valida: ^0.2.0
  query_builder:
    git: https://github.com/bartekwk2/query_builder

  leto_shelf:
  leto_shelf_example:
  leto:
  leto_schema:

dev_dependencies:
  build_runner: ^2.4.15
  freezed: ^3.0.6
  http: ^1.4.0
  json_serializable: ^6.9.5
  lint: ^2.8.0
  test_process: ^2.1.1
  test: ^1.26.2

  gql_exec: ^1.0.0+1
  gql_link: ^1.0.0+1
  gql_websocket_link: ^2.0.1
  gql: ^1.0.0

  leto_generator:
  valida_generator:
    git:
      url: https://github.com/bartekwk2/valida
      path: valida_generator
  query_builder_generator:
    git:
      url: https://github.com/bartekwk2/query_builder
      path: query_builder_generator

dependency_overrides:
  leto_generator:
    path: ../../leto_generator
  leto:
    path: ../../leto
  leto_schema:
    path: ../../leto_schema
  leto_shelf:
    path: ../../leto_shelf
  leto_shelf_example:
    path: ../../leto_shelf/example
