name: leto_generator
version: 0.0.1-dev.4
description: Generates GraphQL schemas from Dart classes, for use with package:leto_schema.
repository: https://github.com/juancastillo0/leto

topics:
  - graphql
  - server
  - protocol
  - codegen

environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:
  analyzer: ">=7.4.5"
  build: ^2.4.2
  build_config: ^1.1.2
  code_builder: ^4.10.1
  source_gen: ^2.0.0

  collection: ^1.19.1
  recase: ^4.1.0
  json_annotation: ^4.7.0
  freezed_annotation: ^3.0.0

  dart_style: ^3.1.0
  glob: ^2.1.3
  path: ^1.9.1

  valida: ^0.2.0
  leto_schema: ^0.0.1-dev.3

dev_dependencies:
  lint: ^2.8.0
