name: leto_shelf_example
description: A sample Dart GraphQL server using leto_shelf.

environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  json_path: ^0.7.6
  oxidized: ^6.2.0

  sqlite3: ^2.7.6
  mysql1: ^0.20.0
  postgres: ^2.4.1+2

  shelf_plus: ^1.0.2
  shelf_router: ^1.1.4
  shelf_static: ^1.1.3

  valida: ^0.2.0
  query_builder:
    git: https://github.com/bartekwk2/query_builder

  leto_shelf:
  leto_schema:
  leto:

dev_dependencies:
  build_runner: ^2.4.15
  freezed: ^3.0.6
  http: ^1.4.0
  json_serializable: ^6.9.5
  lint: ^2.8.0
  test: ^1.0.0

  leto_generator:
  valida_generator:
    git:
      url: https://github.com/bartekwk2/valida
      path: valida_generator
      
  query_builder_generator:
    git:
      url: https://github.com/bartekwk2/query_builder
      path: query_builder_generator

dependency_overrides:
  leto_generator:
    path: ../../leto_generator
  leto_shelf:
    path: ..
  leto:
    path: ../../leto
  leto_schema:
    path: ../../leto_schema
