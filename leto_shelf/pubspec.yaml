name: leto_shelf
description: Build GraphQL web servers with leto and shelf. HTTP, WebSocket, File Uploads, HTML explorers and other utilities.
version: 0.0.1-dev.2
homepage: https://github.com/juancastillo0/leto

topics:
  - graphql
  - server
  - protocol
  - shelf

environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:
  crypto: ^3.0.6
  freezed_annotation: ^3.0.0

  gql: ^1.0.0+1
  http_parser: ^4.1.2
  http_server: ^1.0.0
  mime: ^1.0.0

  json_annotation: ^4.9.0
  oxidized: ^6.2.0

  shelf: ^1.4.2
  shelf_web_socket: ^2.0.0
  web_socket_channel: ^2.0.0

  leto: ^0.0.1-dev.1
  leto_schema: ^0.0.1-dev.3

dev_dependencies:
  build_runner: ^2.4.15
  freezed: ^3.0.6

  gql_exec: ^1.0.0+1
  gql_link: ^1.0.0+1
  gql_websocket_link: ^2.0.1

  http: ^1.4.0
  json_serializable: ^6.9.5
  lint: ^2.8.0
  # tests
  toml: ^0.16.0
  test: ^1.26.2

  leto_shelf_example:
    path: ./example
